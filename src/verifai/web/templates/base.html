<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <script>
    // Light by default. A reader who chose dark gets it before the page paints.
    try { if (localStorage.getItem("verifai-theme") === "dark") document.documentElement.dataset.theme = "dark"; } catch (e) {}
  </script>
  <title>{% block title %}VerifAI{% endblock %}</title>
  <meta name="description" content="VerifAI does the fact-checking legwork for you: it searches Wikipedia, research databases, and fact-checkers, looks up every citation, and links every source it read.">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx.min.js" defer></script>
  <script src="/static/app.js" defer></script>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
      <symbol id="i-cross" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></symbol>
      <symbol id="i-question" viewBox="0 0 24 24"><path d="M9.3 9.2a2.8 2.8 0 1 1 4 2.5c-.8.4-1.3 1-1.3 1.9v.6"/><path d="M12 17.6v.1"/></symbol>
      <symbol id="i-split" viewBox="0 0 24 24"><path d="M4.5 9.5c2.5-2.4 5-2.4 7.5 0s5 2.4 7.5 0M4.5 15c2.5-2.4 5-2.4 7.5 0s5 2.4 7.5 0"/></symbol>
      <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 4.5l8.5 15h-17z"/><path d="M12 10v4M12 16.8v.1"/></symbol>
      <symbol id="i-ban" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.5"/><path d="M6.8 6.8l10.4 10.4"/></symbol>
      <symbol id="i-cloud" viewBox="0 0 24 24"><path d="M7.5 18h9a3.8 3.8 0 0 0 .4-7.6A5.6 5.6 0 0 0 6.2 11.2 3.4 3.4 0 0 0 7.5 18z"/></symbol>
      <symbol id="i-scale" viewBox="0 0 24 24"><path d="M12 4v16M7 20h10M5 8h14M5 8l-2.5 6a2.8 2.8 0 0 0 5 0zM19 8l-2.5 6a2.8 2.8 0 0 0 5 0z"/></symbol>
      <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></symbol>
      <symbol id="i-book" viewBox="0 0 24 24"><path d="M5 5.5A1.5 1.5 0 0 1 6.5 4H19v14H6.5A1.5 1.5 0 0 0 5 19.5zM5 19.5A1.5 1.5 0 0 0 6.5 21H19"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/></symbol>
      <symbol id="i-grid" viewBox="0 0 24 24"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/></symbol>
      <symbol id="i-flask" viewBox="0 0 24 24"><path d="M9.5 3.5h5M10 3.5v6L4.8 18.2A1.5 1.5 0 0 0 6.1 20.5h11.8a1.5 1.5 0 0 0 1.3-2.3L14 9.5v-6M7.5 15h9"/></symbol>
      <symbol id="i-clip" viewBox="0 0 24 24"><path d="M9 4.5h6v2.5H9zM9 5.5H6.5v15h11v-15H15M9.5 11h5M9.5 14.5h5"/></symbol>
      <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.5 2.6 3.5 5.4 3.5 8.5s-1 5.9-3.5 8.5c-2.5-2.6-3.5-5.4-3.5-8.5s1-5.9 3.5-8.5z"/></symbol>
      <symbol id="i-pen" viewBox="0 0 24 24"><path d="M4 20l1-4.5L15.5 5a2.1 2.1 0 0 1 3 3L8 18.5 4 20zM13.5 7l3 3"/></symbol>
      <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
      <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></symbol>
      <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></symbol>
    </defs>
  </svg>
  <header class="topbar">
    <div class="wrap topbar-row">
      <a class="wordmark" href="/" aria-label="VerifAI home">Verif<i>AI</i></a>
      <span class="topbar-note">The claim desk · two sources, or no verdict</span>
      <nav class="topbar-nav" aria-label="Site">
        <a href="/docs">API</a>
        <a href="/privacy">Privacy</a>
        <a href="https://github.com/Timeless-Dave/verifAI" rel="noopener noreferrer">GitHub</a>
        <button type="button" class="theme-toggle" data-theme-toggle role="switch" aria-checked="false" aria-label="Dark mode" title="Dark mode">
          <svg class="icon theme-sun" aria-hidden="true"><use href="#i-sun"/></svg>
          <svg class="icon theme-moon" aria-hidden="true"><use href="#i-moon"/></svg>
          <span class="theme-knob" aria-hidden="true"></span>
        </button>
      </nav>
    </div>
  </header>
  <main class="wrap">
    {% block body %}{% endblock %}
  </main>
  <footer class="wrap site-foot">
    <p>Verdicts come from sources retrieved at check time. A language model’s memory is never a source.</p>
    <p><a href="/docs">API docs</a> · <a href="/privacy">Privacy</a> · MIT license · htmx is vendored under the Zero-Clause BSD license.</p>
  </footer>
</body>
</html>
